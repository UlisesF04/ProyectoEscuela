<style>
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #FF6B35, #F7B32B);
            transition: all 0.2s ease-in-out;
        }
        .gradient-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Main Container / Bento Grid Style for Visual Interest on Desktop, Stacks on Mobile -->
<div class="w-full max-w-5xl mx-auto flex flex-col md:flex-row gap-6 md:gap-8 items-stretch">
<!-- Left Side: Visual / Branding Area (Hidden on very small screens) -->
<div class="hidden md:flex flex-1 rounded-[2rem] bg-surface-container-low overflow-hidden relative shadow-warm-ambient flex-col justify-between p-8 border border-outline-variant/30">
<div class="absolute inset-0 z-0">
<img alt="Students learning" class="w-full h-full object-cover opacity-80 mix-blend-multiply filter contrast-125 saturate-150" data-alt="A brightly lit, modern classroom or study area bathed in warm morning sunlight. Students are engaged in collaborative learning around sleek wooden tables. The overall color palette features vibrant oranges, soft yellows, and warm off-whites to match a welcoming, tactile UI design aesthetic. The mood is optimistic, energetic, and educational, devoid of harsh corporate blues." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWfgkNrU1MFE32-yVsIB6C7hv0jVuYyEbXphzzgjd-bF4TuGQD7Uq0ILFkYEkOiJNMeRIVT7n-SAV0JrTFf0PiQu_ceGO5aHJ9BgQ4geJtvchCp9UrVF-nZZkzIqGJg-FJ_CGgP4jy-Qpo2Sd3Unw27SuqDDUNv_MalVWvLByskc9WaCa6LD8TbbQBpIvKSF2RMXOXxAKCLovyITVz45uNRnQTYH6J9WcL4xsIqaa7I_Z18tKI1aZG4zVspcvs26RFiwxNtwlwHrE"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/90 via-background/40 to-transparent"></div>
</div>
<div class="relative z-10 mt-auto pb-8">
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-4">Transformando la <br/>gestión escolar.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">Una experiencia intuitiva y cálida para educadores, estudiantes y familias.</p>
</div>
</div>
<!-- Right Side: Login Card -->
<div class="flex-1 w-full max-w-md mx-auto bg-surface-container-lowest rounded-card shadow-warm-ambient p-8 md:p-10 border border-outline-variant/20 flex flex-col justify-center">
<!-- Logo Header -->
<div class="text-center mb-8">
<h1 class="font-headline-xl text-headline-xl bg-gradient-to-r from-primary-container to-secondary-container gradient-text pb-1">
                    ProyectoEscuela
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Bienvenido de vuelta</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface ml-1 block" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-[#FFF8F0] border border-outline-variant/50 rounded-input font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all placeholder:text-outline/70" id="email" name="email" placeholder="usuario@escuela.edu" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface ml-1 block" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-[#FFF8F0] border border-outline-variant/50 rounded-input font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all placeholder:text-outline/70" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-tertiary hover:text-primary transition-colors" href="#">¿Olvidé mi contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full gradient-btn rounded-full py-4 px-6 flex justify-center items-center gap-2 mt-4" type="button">
<span class="font-label-md text-label-md text-on-primary">Iniciar Sesión</span>
<span class="material-symbols-outlined text-on-primary text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Optional: Alternative Login -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant text-sm mb-4">¿Necesitas ayuda para acceder?</p>
<a class="font-label-md text-label-md text-primary-container border border-primary-container rounded-full px-6 py-2 inline-block hover:bg-primary-container hover:text-on-primary transition-colors" href="#">Contactar Soporte</a>
</div>
</div>
</div>
</body></html>
