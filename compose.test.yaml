name: proyecto-escuela-tests

services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: proyecto_escuela_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d proyecto_escuela_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    init: true
    environment:
      NODE_ENV: test
      DATABASE_URL: ""
      DB_HOST: db-test
      DB_PORT: "5432"
      DB_NAME: proyecto_escuela_test
      DB_USER: test
      DB_PASSWORD: test
      JWT_SECRET: test-jwt-secret-for-testing-only
      DEMO_PASSWORD: password123
      DB_SYNC_ALTER: "false"
      RESEND_API_KEY: ""
    depends_on:
      db-test:
        condition: service_healthy
